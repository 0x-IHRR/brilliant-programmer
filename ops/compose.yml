# Opt-in full self-hosted stack: combine with ../compose.yml.
x-application: &application
  image: brilliant-programmer:${APP_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .private/runtime.env
  environment:
    DATABASE_URL: postgresql://bp:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${APP_DATABASE:-bp}
    ACCOUNT_ERASURE_JOURNAL: /state/account-deletions.sqlite3
    OPERATIONS_ROOT: /state
    SMTP_HOST: mail
    SMTP_PORT: '1025'
    TMPDIR: /tmp
  user: '${APP_UID:-10001}:${APP_GID:-10001}'
  volumes:
    - ./.private/state:/state
    - ./.private/tls:/tls:ro
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  logging:
    driver: none
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
services:
  app:
    <<: *application
    command: [api]
    ports:
      - '127.0.0.1:${API_PORT:-18138}:8443'
      - '127.0.0.1:${HTTPS_PORT:-18443}:8443'
    healthcheck:
      test: [CMD, python, -m, app.operations.runtime, health-api]
      interval: 10s
      timeout: 3s
      retries: 6
  worker:
    <<: *application
    command: [worker]
    healthcheck:
      test: [CMD, python, -m, app.operations.runtime, health-worker]
      interval: 10s
      timeout: 3s
      retries: 6
  operator:
    <<: *application
    profiles: [operator]
    restart: 'no'
    entrypoint: [python, -m, app.operations.admin]
    command: [check]
