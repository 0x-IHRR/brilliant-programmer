services:
  mail:
    image: axllent/mailpit@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d
    ports:
      - '127.0.0.1:${SMTP_PORT:-11025}:1025'
      - '127.0.0.1:${MAILPIT_HTTP_PORT:-18025}:8025'
    restart: unless-stopped
  db:
    image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    environment:
      POSTGRES_USER: bp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${APP_DATABASE:-bp}
    ports:
      - '127.0.0.1:${DB_PORT:-15432}:5432'
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bp -d ${APP_DATABASE:-bp}']
      interval: 2s
      retries: 20
    restart: unless-stopped
volumes:
  database:
