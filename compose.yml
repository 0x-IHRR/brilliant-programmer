services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: bp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: bp
    ports:
      - '127.0.0.1:${DB_PORT:-15432}:5432'
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bp -d bp']
      interval: 2s
      retries: 20
volumes:
  database:
